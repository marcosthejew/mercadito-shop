apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: catalog-migrate
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: migrate
        image: mercadito-catalog
        args: ["migrate"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: shop-postgres
              key: url
