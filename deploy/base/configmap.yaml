apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  # storefront goes through the caching proxy (catalog-cache.yaml), not straight to catalog.
  CATALOG_URL: http://catalog-cache:8081
  CART_URL: http://cart:8082
  CHECKOUT_URL: http://checkout:8083
  PAYMENTS_URL: http://payments-mock:8084
  WARMUP_SECONDS: "45"
  # 0 meant no limit: any width 16-2048 was cached forever. Second line of defence behind
  # catalog-cache, which already rejects widths the shop does not use.
  THUMB_CACHE_MAX_MB: "64"
  CART_STORE: redis
  # Per checkout pod. Postgres allows 47; worst case during a deploy is 3 checkout pods x 6
  # + 5 catalog pods x 4 + ~6 internal = 44.
  DB_MAX_CONNS: "6"
  SHUTDOWN_DRAIN_SECONDS: "10"
  PAYMENT_LATENCY_MS: "50"
  PAYMENT_JITTER_MS: "0"
  PAYMENT_FAILURE_RATE: "0"
  # checkout holds a DB connection and stock row locks while it waits for payment, and
  # storefront gives up after 10 s: 3 attempts x 2 s + backoff stays under that.
  PAYMENT_TIMEOUT_MS: "2000"
  # Few on purpose: the provider must dedupe on order_ref or a retry may charge twice.
  PAYMENT_RETRIES: "2"
  PAYMENT_BACKOFF_MS: "100"
