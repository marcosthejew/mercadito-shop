apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
spec:
  # Let's Encrypt certificate issued by hand (no cert-manager in the cluster) and stored as
  # a Secret outside the pipeline, like ghcr-pull. snapshare needs HTTPS: browsers only
  # expose crypto.subtle on secure pages.
  tls:
  - hosts:
    - shop.178.105.120.178.sslip.io
    secretName: shop-tls
  rules:
  - host: shop.178.105.120.178.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storefront
            port:
              number: 8080
